[colors]
background = #F013161f
background-alt = #232738
foreground = #d9deee
primary = #8aa4ff
secondary = #b4a0ff
green = #a9d9a0
yellow = #ecd08a
red = #ef8e9a
orange = #f0a77c
cyan = #8ad6e0
muted = #6f7896

[bar/main]
bottom = true
width = 100%
height = 40
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=11;3
font-1 = Font Awesome 6 Free:style=Solid:size=11;3
font-2 = Font Awesome 6 Brands:style=Regular:size=11;3
font-3 = JetBrainsMono Nerd Font:size=15;4
font-4 = JetBrainsMono Nerd Font:style=Bold:size=11;3
font-5 = Font Awesome 6 Brands:style=Regular:size=15;4
font-6 = Font Awesome 6 Free:style=Solid:size=15;4
font-7 = Symbols Nerd Font:size=11;3
modules-left = launcher workspaces xwindow
modules-center = dock-terminal dock-files dock-browser dock-discord dock-spotify dock-steam
modules-right = mpris obs mode idle date weather cpu memory uptime vpn bluetooth backlight pulseaudio mic network ethernet battery tray power
cursor-click = pointer
enable-ipc = true

[module/launcher]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.primary}
content-padding = 2
click-left = rofi -show drun

[module/workspaces]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-workspaces
tail = true

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.muted}

[module/dock-terminal]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.green}
content-padding = 2
click-left = kitty

[module/dock-files]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.yellow}
content-padding = 2
click-left = dolphin

[module/dock-browser]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.orange}
content-padding = 2
click-left = firefox

[module/dock-discord]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.secondary}
content-padding = 2
click-left = discord

[module/dock-spotify]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.green}
content-padding = 2
click-left = spotify

[module/dock-steam]
type = custom/text
content-font = 4
content = ""
content-foreground = ${colors.primary}
content-padding = 2
click-left = steam

[module/mpris]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-mpris
interval = 2
click-left = playerctl play-pause
click-right = playerctl next

[module/obs]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-json ${env:HOME}/.local/bin/status-obs
interval = 3
click-left = ${env:HOME}/.local/bin/obs-open
click-right = ${env:HOME}/.local/bin/desktop-mode stream

[module/mode]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-json ${env:HOME}/.local/bin/status-mode
interval = 2
click-left = ${env:HOME}/.local/bin/desktop-mode toggle
click-right = ${env:HOME}/.local/bin/desktop-mode menu

[module/idle]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-idle status
interval = 2
click-left = ${env:HOME}/.local/bin/polybar-idle toggle

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %d %b
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %date%
label-font = 5

[module/weather]
type = custom/script
exec = ${env:HOME}/.local/bin/status-weather
interval = 900

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.cyan}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%

[module/uptime]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-uptime
interval = 60

[module/vpn]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-json ${env:HOME}/.local/bin/openvpn-status
interval = 3
click-left = ${env:HOME}/.local/bin/openvpn-menu
click-right = ${env:HOME}/.local/bin/openvpn-menu disconnect

[module/bluetooth]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-bt
interval = 3
click-left = ${env:HOME}/.local/bin/bluetooth-menu
click-right = ${env:HOME}/.local/bin/bluetooth-menu toggle

[module/backlight]
type = custom/script
exec = brightnessctl -m 2>/dev/null | awk -F, '{print $4}'
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.red}
click-right = pavucontrol

[module/mic]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-mic
interval = 2
click-left = ${env:HOME}/.local/bin/mic-menu
click-right = pactl set-source-mute @DEFAULT_SOURCE@ toggle
scroll-up = pactl set-source-volume @DEFAULT_SOURCE@ +5%
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}
label-connected = %signal%%
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = offline
click-left = nm-connection-editor

[module/ethernet]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = ""
format-connected-prefix-foreground = ${colors.green}
label-connected =
format-disconnected =
click-left = nm-connection-editor

[module/battery]
type = custom/script
exec = ${env:HOME}/.local/bin/polybar-battery
interval = 5

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 60%

[module/power]
type = custom/text
content = ""
content-foreground = ${colors.red}
content-padding = 2
click-left = ${env:HOME}/.local/bin/desktop-mode menu
