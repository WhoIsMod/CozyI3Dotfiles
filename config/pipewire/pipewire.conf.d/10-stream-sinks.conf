# Virtual sinks for streaming. Route each app to one of these (pavucontrol -> Playback),
# then add each sink's "Monitor of ..." as a separate audio source in OBS.
# You still hear them: each sink plays through your default output.
context.modules = [
    { name = libpipewire-module-loopback
        args = {
            node.description = "Stream Game"
            capture.props = {
                node.name = "stream_game"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "stream_game.output"
                node.passive = true
                audio.position = [ FL FR ]
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Stream Music"
            capture.props = {
                node.name = "stream_music"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "stream_music.output"
                node.passive = true
                audio.position = [ FL FR ]
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Stream Chat"
            capture.props = {
                node.name = "stream_chat"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "stream_chat.output"
                node.passive = true
                audio.position = [ FL FR ]
            }
        }
    }
]
