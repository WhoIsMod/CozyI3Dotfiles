backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'"
];

inactive-opacity = 0.96;
frame-opacity = 1.0;
opacity-rule = [
    "96:class_g = 'kitty'",
    "100:class_g = 'obs'"
];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
